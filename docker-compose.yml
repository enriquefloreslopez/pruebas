# Plataforma completa: app, base de datos, túnel de Cloudflare y respaldos diarios.
# Uso: copia .env.docker.example como .env, llénalo y corre `docker compose up -d --build`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citas
      POSTGRES_USER: citas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas -d citas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Falta NEXT_PUBLIC_SITE_URL en .env}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://citas:${POSTGRES_PASSWORD}@db:5432/citas
    depends_on:
      db:
        condition: service_healthy
    # En la nube se queda en 127.0.0.1 (solo el túnel entra). En un local, APP_BIND=0.0.0.0
    # permite abrir la agenda desde otros equipos de la red del negocio.
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - app

  respaldos:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy
    # Un respaldo al día; se guardan los últimos 14.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U citas citas | gzip > /respaldos/citas-$$(date +%F).sql.gz
          find /respaldos -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  datos:
